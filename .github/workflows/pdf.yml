
name: Convertir dossier en PDF

on:
  workflow_dispatch:

jobs:
  convertir:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Generer le PDF
        uses: docker://pandoc/latex:3.8
        with:
          args: >-
            doc/dossier.md
            -o doc/dossier.pdf
            --resource-path=doc
            --pdf-engine=xelatex
            -V geometry:margin=2cm
            -V fontsize=11pt

      - name: Recuperer le PDF
        uses: actions/upload-artifact@v4
        with:
          name: dossier-R1-PDF
          path: doc/dossier.pdf
