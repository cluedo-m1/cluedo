<header>
  <h1>Cluedo</h1>
  <p class="discret">{{ version() }}</p>
</header>
@if (erreur()) {
  <p class="erreur" role="alert">{{ erreur() }}</p>
}
<main>
  <button (click)="resoudre()">Résoudre l'enquête</button>

  @if (resultat(); as r) {
    <p>Nombre de solutions : {{ r.nombreSolutions }}</p>
    <ul>
      @for (entree of r.domaines | keyvalue; track entree.key) {
        <li>{{ entree.key }} : {{ entree.value.join(', ') }}</li>
      }
    </ul>
  }
  <router-outlet />
</main>
